[from-internal-custom]

; traccia esplicita su file: non dipende dal livello verbose di Asterisk,
; che impostato da "asterisk -rx" vale solo per la console effimera
exten => 500,1,NoOp(assistente vocale)
 same => n,System(/bin/echo "$(/bin/date +%T) 1 entrato" >> /tmp/dialplan.log)
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,System(/bin/echo "$(/bin/date +%T) 2 risposto" >> /tmp/dialplan.log)
 same => n,Playback(/var/lib/asterisk/sounds/assistant/greeting)
 same => n,System(/bin/echo "$(/bin/date +%T) 3 saluto: ${PLAYBACKSTATUS}" >> /tmp/dialplan.log)

 same => n(loop),System(/bin/echo "$(/bin/date +%T) 4 chiamo agi" >> /tmp/dialplan.log)
 same => n,AGI(assistant.agi)
 same => n,System(/bin/echo "$(/bin/date +%T) 5 agi=${AGISTATUS} file=${ASSIST_FILE} azione=${ASSIST_ACTION}" >> /tmp/dialplan.log)
 same => n,GotoIf($["${ASSIST_ACTION}" = "hangup"]?bye)
 same => n,GotoIf($["${ASSIST_FILE}" = ""]?loop)
 same => n,BackgroundDetect(${ASSIST_FILE},1000,400,60000)
 same => n,System(/bin/echo "$(/bin/date +%T) 6 riprodotto" >> /tmp/dialplan.log)
 same => n,Goto(loop)

 same => n(bye),Playback(/var/lib/asterisk/sounds/assistant/goodbye)
 same => n,Hangup()

exten => talk,1,System(/bin/echo "$(/bin/date +%T) 7 interrotto dalla voce" >> /tmp/dialplan.log)
 same => n,Goto(500,loop)

; Fine chiamata: si butta via la memoria della conversazione e i file audio.
; Riagganciare deve chiudere la sessione, non lasciarla appesa.
exten => h,1,System(/bin/rm -f /tmp/conv-${UNIQUEID}.json /tmp/silence-${UNIQUEID} /tmp/reply-${UNIQUEID}.sln16 /tmp/reply-${UNIQUEID}.wav16 /tmp/ask-${UNIQUEID}.wav /tmp/ask-${UNIQUEID}.wav16)
 same => n,System(/bin/echo "$(/bin/date +%T) 9 chiusa, sessione pulita" >> /tmp/dialplan.log)
