<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a7ae0"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2d52"/><stop offset="100%" stop-color="#1a1b31"/>
    </linearGradient>
  </defs>

  <rect width="900" height="470" rx="14" fill="url(#bg)"/>

  <!-- telefono -->
  <rect x="34" y="140" width="180" height="150" rx="10" fill="#32355f" stroke="#4a4e86"/>
  <text x="124" y="176" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">CP-8851</text>
  <text x="124" y="202" text-anchor="middle" fill="#98a5d8" font-size="13">firmware Enterprise</text>
  <text x="124" y="230" text-anchor="middle" fill="#7f8cc4" font-size="12">SIP / UDP 5060</text>
  <text x="124" y="250" text-anchor="middle" fill="#7f8cc4" font-size="12">audio G.722</text>
  <text x="124" y="272" text-anchor="middle" fill="#7f8cc4" font-size="12">nessuna web UI</text>

  <!-- raspberry -->
  <rect x="300" y="70" width="290" height="330" rx="10" fill="#32355f" stroke="#5a7ae0" stroke-width="2"/>
  <text x="445" y="102" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Raspberry Pi</text>

  <rect x="320" y="122" width="250" height="52" rx="7" fill="#3b3f6d"/>
  <text x="336" y="145" fill="#dfe4f7" font-size="14" font-weight="600">Asterisk / FreePBX</text>
  <text x="336" y="164" fill="#8b98d0" font-size="12">registrar SIP, dialplan, AGI</text>

  <rect x="320" y="184" width="250" height="52" rx="7" fill="#3b3f6d"/>
  <text x="336" y="207" fill="#dfe4f7" font-size="14" font-weight="600">TFTP :69 + HTTP :6970</text>
  <text x="336" y="226" fill="#8b98d0" font-size="12">provisioning al posto di CUCM</text>

  <rect x="320" y="246" width="250" height="52" rx="7" fill="#3b3f6d"/>
  <text x="336" y="269" fill="#dfe4f7" font-size="14" font-weight="600">assistente (Python)</text>
  <text x="336" y="288" fill="#8b98d0" font-size="12">voce, promemoria, strumenti</text>

  <rect x="320" y="308" width="250" height="52" rx="7" fill="#3b3f6d"/>
  <text x="336" y="331" fill="#dfe4f7" font-size="14" font-weight="600">schermata :8081</text>
  <text x="336" y="350" fill="#8b98d0" font-size="12">pannello + autenticazione</text>

  <!-- servizi -->
  <rect x="676" y="96" width="190" height="80" rx="10" fill="#32355f" stroke="#4a4e86"/>
  <text x="771" y="128" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">ElevenLabs</text>
  <text x="771" y="150" text-anchor="middle" fill="#8b98d0" font-size="12">trascrive e sintetizza</text>

  <rect x="676" y="196" width="190" height="80" rx="10" fill="#32355f" stroke="#4a4e86"/>
  <text x="771" y="228" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Claude</text>
  <text x="771" y="250" text-anchor="middle" fill="#8b98d0" font-size="12">risposte e strumenti</text>

  <rect x="676" y="296" width="190" height="80" rx="10" fill="#32355f" stroke="#4a4e86"/>
  <text x="771" y="328" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Google</text>
  <text x="771" y="350" text-anchor="middle" fill="#8b98d0" font-size="12">posta e agenda, lettura</text>

  <!-- collegamenti -->
  <line x1="214" y1="200" x2="294" y2="200" stroke="#5a7ae0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="294" y1="240" x2="214" y2="240" stroke="#5a7ae0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="150" x2="670" y2="140" stroke="#5a7ae0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="235" x2="670" y2="235" stroke="#5a7ae0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="330" x2="670" y2="333" stroke="#5a7ae0" stroke-width="2" marker-end="url(#a)"/>

  <text x="254" y="192" text-anchor="middle" fill="#98a5d8" font-size="11">SIP</text>
  <text x="254" y="262" text-anchor="middle" fill="#98a5d8" font-size="11">config</text>

  <text x="450" y="438" text-anchor="middle" fill="#6f7cb4" font-size="12.5">
    Il telefono crede di parlare con un CUCM: in realtà il campo processNodeName punta ad Asterisk
  </text>
</svg>
